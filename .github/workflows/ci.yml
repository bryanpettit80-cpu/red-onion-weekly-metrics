name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: _program
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        working-directory: _program
        run: python -m pytest -q
      - name: Compile script
        run: python -m py_compile _program/red_onion_weekly_metrics.py

  windows-launcher-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        working-directory: _program
        run: python -m pip install -e ".[dev]"
      - name: Run Windows launcher behavior tests
        working-directory: _program
        run: python -m pytest -q tests/test_launcher_integrity.py

